<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit an Incident — Deaths at the Grand Canyon</title>
<meta name="robots" content="noindex">

<script>
  const SUPABASE_URL = "";
  const SUPABASE_ANON_KEY = "";
</script>

<style>

</style>
</head>
<body>

<div class="card">

  <!-- Shown when nobody is logged in -->
  <div id="loginView">
    <h1>Report an Incident</h1>
    <p class="sub">Enter your email and we'll send you a one-time link to sign in. No password needed.</p>
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <button id="sendLink">Send me a login link</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- Shown after they click the magic link and land back here -->
  <div id="loggedInView" style="display:none;">
    <h1>You're signed in</h1>
    <p class="sub">Signed in as <span class="signed-in-email" id="userEmail"></span></p>

    <form id="incidentForm">
      <div class="field">
        <label for="location">Location</label>
        <select id="location" required>
 <option value=""></option>
        </select>
      </div>

      <div class="row">
        <div class="field">
          <label for="year">Year</label>
          <input type="number" id="year" placeholder="e.g. 2019" min="1800" max="2100" required>
        </div>
        <div class="field">
          <label for="month">Month (optional)</label>
          <input type="number" id="month" min="1" max="12" placeholder="1–12">
        </div>
        <div class="field">
          <label for="day">Day (optional)</label>
          <input type="number" id="day" min="1" max="31" placeholder="1–31">
        </div>
      </div>

      <div class="msg" id="existingNote"></div>

      <div class="field">
        <label for="cause">Cause</label>
        <select id="cause" required>
          <option value="">Select a cause…</option>
          <option value="Fall">Fall</option>
          <option value="Falling rock/ice">Falling rock/ice</option>
          <option value="Avalanche">Avalanche</option>
          <option value="Cardiac event">Cardiac event</option>
          <option value="Lightning">Lightning</option>
          <option value="Unclear">Unclear</option>
        </select>
      </div>

      <div class="field">
        <label for="victimName">Victim's name (optional)</label>
        <input type="text" id="victimName" placeholder="Leave blank if unknown">
      </div>

      <div class="row">
        <div class="field">
          <label for="gender">Gender (optional)</label>
          <select id="gender">
            <option value="M" selected>Male</option>
            <option value="F">Female</option>
            <option value="">Unknown</option>
          </select>
        </div>
        <div class="field">
          <label for="age">Age (optional)</label>
          <select id="age">
            <option value="">Unknown</option>
            <option value="<20">Under 20</option>
            <option value="20-29">20–29</option>
            <option value="30-39">30–39</option>
            <option value="40-49">40–49</option>
            <option value="50-59">50–59</option>
            <option value="60+">60+</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="details">Additional details (optional)</label>
        <textarea id="details" rows="4" placeholder="Route, conditions, sourcing — anything else worth noting."></textarea>
      </div>

      <button type="submit" id="submitIncident">Submit for review</button>
      <div class="msg" id="formMsg"></div>
    </form>

    <p class="sub" style="margin-top:16px;">Submissions are reviewed before anything is published — this doesn't go live automatically.</p>

    <button id="signOut">Sign out</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginView = document.getElementById('loginView');
  const loggedInView = document.getElementById('loggedInView');
  const emailInput = document.getElementById('email');
  const sendLinkBtn = document.getElementById('sendLink');
  const loginMsg = document.getElementById('loginMsg');
  const userEmailEl = document.getElementById('userEmail');
  const signOutBtn = document.getElementById('signOut');

  const incidentForm = document.getElementById('incidentForm');
  const submitBtn = document.getElementById('submitIncident');
  const formMsg = document.getElementById('formMsg');
  const locationInput = document.getElementById('location');
  const yearInput = document.getElementById('year');
  const monthInput = document.getElementById('month');
  const dayInput = document.getElementById('day');
  const causeInput = document.getElementById('cause');
  const victimNameInput = document.getElementById('victimName');
  const genderInput = document.getElementById('gender');
  const ageInput = document.getElementById('age');
  const detailsInput = document.getElementById('details');
  const existingNote = document.getElementById('existingNote');

  // Filled in once we know who's signed in — the insert below uses this
  // rather than trusting anything the form itself could claim.
  let currentUser = null;

  function showMsg(el, text, kind){
    el.textContent = text;
    el.className = 'msg show ' + kind;
  }

  function hideMsg(el){
    el.className = 'msg';
  }

  // A soft heads-up, not a hard block: once both location and year are
  // filled in, check whether anything's already on record for that
  // location/year so a submitter can recognize "oh, someone already
  // reported this" before creating a near-duplicate. Distinct incidents
  // on the same location in the same year are real and should still be
  // submitted -- this is just a nudge, not a validation error.
  let existingCheckToken = 0;
  async function checkExisting(){
    const location = locationInput.value;
    const year = yearInput.value.trim();
    const token = ++existingCheckToken;

    if (!location || !year){
      hideMsg(existingNote);
      return;
    }

    const { data, error } = await client
      .from('incidents')
      .select('victim_name,cause')
      .eq('location', location)
      .eq('year', Number(year))
      .eq('status', 'approved');

    // If the location/year changed again while this was in flight, or the
    // fields have since been cleared, let the newer check win.
    if (token !== existingCheckToken) return;
    if (error || !data || !data.length){
      hideMsg(existingNote);
      return;
    }

    const items = data
      .map(r => (r.victim_name ? r.victim_name : 'unnamed victim') + ' (' + (r.cause || 'cause unclear') + ')')
      .join('; ');
    showMsg(
      existingNote,
      (data.length === 1 ? 'Already on record' : data.length + ' incidents already on record') +
        ' for ' + location + ' in ' + year + ': ' + items +
        '. Still submit if this is a different person.',
      'info'
    );
  }

  locationInput.addEventListener('change', checkExisting);
  let yearCheckTimer = null;
  yearInput.addEventListener('input', () => {
    clearTimeout(yearCheckTimer);
    yearCheckTimer = setTimeout(checkExisting, 400);
  });

  function showLoggedIn(session){
    loginView.style.display = 'none';
    loggedInView.style.display = 'block';
    userEmailEl.textContent = session.user.email;
    currentUser = session.user;
  }

  function showLoggedOut(){
    loginView.style.display = 'block';
    loggedInView.style.display = 'none';
    currentUser = null;
  }

  sendLinkBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    if (!email){
      showMsg(loginMsg, 'Enter an email address first.', 'error');
      return;
    }
    sendLinkBtn.disabled = true;
    sendLinkBtn.textContent = 'Sending…';

    const { error } = await client.auth.signInWithOtp({
      email,
      options: {
        emailRedirectTo: window.location.origin + '/submit.html'
      }
    });

    sendLinkBtn.disabled = false;
    sendLinkBtn.textContent = 'Send me a login link';

    if (error){
      showMsg(loginMsg, 'Something went wrong: ' + error.message, 'error');
    } else {
      showMsg(loginMsg, 'Check your inbox — click the link there to come back here signed in.', 'success');
    }
  });

  signOutBtn.addEventListener('click', async () => {
    await client.auth.signOut();
    showLoggedOut();
  });

  incidentForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!currentUser){
      showMsg(formMsg, 'You need to be signed in to submit — try refreshing the page.', 'error');
      return;
    }

    const location = locationInput.value.trim();
    const year = yearInput.value.trim();
    const cause = causeInput.value.trim();

    if (!location || !year || !cause){
      showMsg(formMsg, 'Location, year, and cause are required.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    // Every row is tagged with the signed-in user's own id. The database's
    // row-level security policy double-checks this matches whoever is
    // actually authenticated — the app can't get this wrong even if it tried.
    const { error } = await client.from('incidents').insert({
      location,
      year: Number(year),
      month: monthInput.value ? Number(monthInput.value) : null,
      day: dayInput.value ? Number(dayInput.value) : null,
      cause,
      victim_name: victimNameInput.value.trim() || null,
      gender: genderInput.value || null,
      age: ageInput.value.trim() || null,
      incident_details: detailsInput.value.trim() || null,
      submitted_by: currentUser.id
    });

    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit for review';

    if (error){
      showMsg(formMsg, 'Something went wrong: ' + error.message, 'error');
    } else {
      showMsg(formMsg, 'Thanks — your submission is in for review.', 'success');
      incidentForm.reset();
    }
  });

  // Supabase's JS library automatically reads the login info out of the URL
  // when you land back here from the emailed link, then fires this event.
  client.auth.onAuthStateChange((event, session) => {
    if (session){
      showLoggedIn(session);
    } else {
      showLoggedOut();
    }
  });

  // Also check on page load in case a session already exists (e.g. you
  // refresh the page after signing in).
  client.auth.getSession().then(({ data: { session } }) => {
    if (session){
      showLoggedIn(session);
    }
  });
</script>

</body>
</html>
